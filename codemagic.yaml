workflows:
  wizzo-ios-workflow:
    name: Wizzo Mobile iOS Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "app.wizzo.wizzoMarket"
      groups:
        - "apple store"
    scripts:
      - name: Install dependencies & pods
        script: |
          flutter pub get
          cd ios
          pod install
          cd ..
      - name: Set up code signing
        script: |
          # Automatically fetch or create signing files from Apple Developer Portal
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-identifier "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --type IOS_APP_STORE \
            --create
          
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true