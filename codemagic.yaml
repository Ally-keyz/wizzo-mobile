# Wizzo Market — iOS / App Store release pipeline.
#
# Required Codemagic setup (Team settings → Environment variables, group
# "apple store"):
#   APP_STORE_CONNECT_PRIVATE_KEY   contents of the AuthKey_XXXXXXXXXX.p8 file
#   APP_STORE_CONNECT_KEY_IDENTIFIER  the key ID shown in App Store Connect
#   APP_STORE_CONNECT_ISSUER_ID     the issuer ID shown in App Store Connect
#   CERTIFICATE_PRIVATE_KEY         PEM private key used to create/import the
#                                   Apple Distribution certificate
#
# The App Store Connect API key must have App Manager rights, and an app record
# for `app.wizzo.wizzoMarket` must already exist in App Store Connect.
#
# If the API key is stored as a Codemagic integration instead of env vars, add
#   integrations:
#     app_store_connect: <integration name>
# under `environment`; Codemagic then injects the three APP_STORE_CONNECT_*
# variables. CERTIFICATE_PRIVATE_KEY still belongs in the "apple store" group.
#
# Version/build number come from pubspec.yaml. Bump the build number before
# every upload (App Store Connect rejects a build number it has already seen).
workflows:
  wizzo-ios-workflow:
    name: Wizzo Market iOS – App Store
    max_build_duration: 90
    environment:
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
      groups:
        - "apple store"
      vars:
        BUNDLE_ID: "app.wizzo.wizzoMarket"
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
          cd ..

      - name: Static analysis
        # The project still has a few info/warning lints; only hard errors
        # should block a release build.
        script: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Verify App Store Connect credentials
        script: |
          missing=0
          for name in APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID CERTIFICATE_PRIVATE_KEY; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "MISSING: $name"
              missing=1
            else
              echo "OK: $name"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing variables to the Codemagic environment group 'apple store' (or use an App Store Connect integration)."
            exit 1
          fi

      - name: Inspect App Store Connect credentials
        # Prints only shapes/brackets, never the key itself. Apple returns 401
        # when the Key ID and the .p8 do not belong together, when the Issuer ID
        # has stray whitespace/quotes, or when the key was revoked.
        script: |
          echo "Key ID:    [$APP_STORE_CONNECT_KEY_IDENTIFIER]"
          echo "Issuer ID: [$APP_STORE_CONNECT_ISSUER_ID]"
          echo "p8 chars:  ${#APP_STORE_CONNECT_PRIVATE_KEY}"
          if [ -f "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "WARNING: APP_STORE_CONNECT_PRIVATE_KEY is a file path, not PEM text"
          fi
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" | sed -n '1p;$p'

      - name: Initialise signing keychain
        script: keychain initialize

      - name: Fetch App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Import distribution certificate
        script: keychain add-certificates

      - name: Apply provisioning profiles to the Xcode project
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-method app-store

      - name: Verify IPA artifact
        # Codemagic's App Store Connect publisher only uploads .ipa/.pkg files
        # that were collected as build artifacts. When the export step fails
        # quietly the publisher logs "no IPAs or PKGs found" and skips the
        # upload, which looks like a successful build. Fail here instead.
        script: |
          set -e
          echo "--- build/ios ---"
          ls -la build/ios || true
          echo "--- ipa files ---"
          find build -name "*.ipa" -print || true
          ipa="$(find build -name '*.ipa' -type f | head -n 1)"
          if [ -z "$ipa" ]; then
            echo "No .ipa was produced. Check the 'Build IPA' step output above:"
            echo "the archive must finish with 'Built IPA to ...' and the export"
            echo "needs a valid App Store provisioning profile for $BUNDLE_ID."
            exit 1
          fi
          echo "IPA ready: $ipa ($(du -h "$ipa" | cut -f1))"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.pkg
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        # Contents of the AuthKey_XXXXXXXXXX.p8 file (not a path).
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

